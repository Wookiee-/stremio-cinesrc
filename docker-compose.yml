services:
  stremio-cinesrc:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: stremio-cinesrc
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:7001"
    environment:
      - PORT=7001
      - HOST=0.0.0.0
      - SIDECAR_PORT=8001
      - CINESRC_URL=http://127.0.0.1:8001
      - STREAM_MODE=direct  # direct = zero VPS video bytes via proxyHeaders (Nuvio); proxy for Stremio if direct stalls
      - SIDECAR_AUTOSTART=1  # single-port: FastAPI autostarts sidecar internally, only 7001 exposed
      # - STREAM_MODE=proxy      # VPS proxies every byte (Stremio fallback if direct stalls)
      # - CINESRC_PROVIDERS=5  # top servers probed per title (default 5, no fallbacks past them)
    # no networks/volumes needed - host nginx proxies to 127.0.0.1:7001
    # Python direct: returns upstream URLs + proxyHeaders, VPS only scrapes, 0 video bandwidth
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; p=os.getenv('PORT','7001'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

# Host nginx handles TLS (see nginx/cinesrc.conf if added, or use setup from README)
#   proxy_pass http://127.0.0.1:7001;
#   sudo certbot --nginx -d cinesrc.ddns.net
