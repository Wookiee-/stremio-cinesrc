# cinesrc.ddns.net - host nginx reverse proxy to Docker cinesrc:7001
# Deploy to host: sudo cp nginx/cinesrc.conf /etc/nginx/sites-available/cinesrc.ddns.net
# Then: sudo ln -sf /etc/nginx/sites-available/cinesrc.ddns.net /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# TLS via: sudo certbot --nginx -d cinesrc.ddns.net (certbot will auto-add 443 block)

server {
    listen 80;
    listen [::]:80;
    server_name cinesrc.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # host nginx -> Docker cinesrc on 127.0.0.1:7001 (docker-compose.yml: ports 127.0.0.1:7001:7001)
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;
        proxy_max_temp_file_size 0;
    }
}
# certbot --nginx will append the 443 server block here automatically
